<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提名小程序 · 扫码入口</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="entry-wrap">
    <h2>优秀员工提名 · 扫码入口</h2>
    <p style="color:var(--muted);">经理使用手机相机 / 微信扫一扫，即可打开提名小程序</p>

    <div class="qr">
      <img src="/qr.png" alt="提名小程序二维码">
    </div>

    <div class="steps card">
      <div class="section-title">使用步骤</div>
      <p>1. 用手机扫描上方二维码，自动打开提名表单（即"登录"小程序）。</p>
      <p>2. 填写提名经理、被提名员工 SESA 号、姓名及提名理由（≥80 字，需具体事例）。</p>
      <p>3. 点击提交，信息将安全存入公司数据库。</p>
      <p>4. 管理员访问 <code>/admin</code> 可查看并导出全部提名。</p>
    </div>

    <p style="color:var(--muted);font-size:12px;margin-top:18px;">
      说明：本页二维码指向当前服务地址。正式部署时请将服务绑定到公司内网域名，
      二维码即可在全公司范围内扫码使用。
    </p>
  </div>
</body>
</html>
